name: Probe sources

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'scripts/probe.sh'
      - '.github/workflows/probe.yml'
  workflow_dispatch:
    inputs:
      script:
        description: "Probe script path"
        required: false
        default: "scripts/probe.sh"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run probe
        run: bash ${{ inputs.script || 'scripts/probe.sh' }}
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: probe-out/
          if-no-files-found: ignore
