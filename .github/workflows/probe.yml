name: Probe sources

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'scripts/probe.sh'
      - '.github/workflows/probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run probe
        run: bash scripts/probe.sh 2>&1 | tee probe-out/summary.txt
      - name: Commit probe output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf probe-out/x probe-out/h probe-out/p
          find probe-out -type f -size +2M -delete
          git add -f probe-out
          git commit -m "probe output" || exit 0
          git push
